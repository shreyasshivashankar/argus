services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  argus:
    build:
      context: .
      target: production
    command: ["--track"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://argus:argus@postgres:5432/argus
      - KALSHI_PRIVATE_KEY_PATH=/app/keys/kalshi_private_key.pem
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ${KALSHI_PRIVATE_KEY_PATH:-./keys/kalshi_private_key.pem}:/app/keys/kalshi_private_key.pem:ro
    restart: unless-stopped

  argus-paper:
    build:
      context: .
      target: production
    command: ["--paper", "--track"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://argus:argus@postgres:5432/argus
      - KALSHI_PRIVATE_KEY_PATH=/app/keys/kalshi_private_key.pem
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ${KALSHI_PRIVATE_KEY_PATH:-./keys/kalshi_private_key.pem}:/app/keys/kalshi_private_key.pem:ro
    profiles:
      - paper

  argus-monitor:
    build:
      context: .
      target: production
    entrypoint: ["python", "-m", "scripts.monitor"]
    command: []
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://argus:argus@postgres:5432/argus
    tty: true
    stdin_open: true
    profiles:
      - monitor

  test:
    build:
      context: .
      target: test
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - KALSHI_API_KEY_ID=test-key
      - KALSHI_PRIVATE_KEY_PATH=/dev/null
      - KALSHI_ENV=demo
    profiles:
      - test

volumes:
  pgdata:
  redis_data:
