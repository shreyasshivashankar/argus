services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  argus:
    build:
      context: .
      target: production
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./logs:/app/logs
      - ${KALSHI_PRIVATE_KEY_PATH:-./keys/kalshi_private_key.pem}:/app/keys/kalshi_private_key.pem:ro
    restart: unless-stopped

  argus-paper:
    build:
      context: .
      target: production
    command: ["python", "main.py", "--paper"]
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./logs:/app/logs
      - ${KALSHI_PRIVATE_KEY_PATH:-./keys/kalshi_private_key.pem}:/app/keys/kalshi_private_key.pem:ro
    profiles:
      - paper

  test:
    build:
      context: .
      target: test
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - KALSHI_API_KEY_ID=test-key
      - KALSHI_PRIVATE_KEY_PATH=/dev/null
      - KALSHI_ENV=demo
    profiles:
      - test

volumes:
  redis_data:
